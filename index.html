<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Smith Software v Grünfeld Präzisionstechnik — Matter Browser</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --parchment: #FDFAF5;
    --parchment-deep: #F7F3EC;
    --ink: #1C1A17;
    --ink-soft: #3A342B;
    --rule: #D9CDB6;
    --rule-soft: #ECE3D0;
    --gold: #8B6F47;
    --gold-bright: #C39B5C;
    --highlight: #F4D87A;
    --muted: #7A6F5E;

    --hdr-root: #6B6256;
    --hdr-appellate: #6E3A2F;
    --hdr-authority: #4A5A3A;
    --hdr-billing: #8B6F47;
    --hdr-client-emails: #2F4A6B;
    --hdr-discovery: #5A3A6E;
    --hdr-exhibits: #6E5A2F;
    --hdr-lower-court: #3A4A5A;

    --sidebar-w: 340px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--parchment);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Apple Garamond", "Times New Roman", serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  code, kbd, .mono { font-family: "SF Mono", "Menlo", "Consolas", "Liberation Mono", monospace; }

  /* ---------- Layout ---------- */
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header.banner {
    background: var(--ink);
    color: var(--parchment);
    padding: 14px 24px 12px;
    border-bottom: 3px double var(--gold);
    flex: 0 0 auto;
  }
  header.banner h1 {
    margin: 0;
    font-size: 19px;
    font-weight: normal;
    letter-spacing: 0.04em;
  }
  header.banner h1 .v {
    font-style: italic;
    color: var(--gold-bright);
    margin: 0 8px;
  }
  header.banner .sub {
    margin-top: 3px;
    font-size: 12px;
    color: #C8BFAE;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .stats {
    background: var(--parchment-deep);
    border-bottom: 1px solid var(--rule);
    padding: 8px 24px;
    display: flex;
    gap: 24px;
    font-size: 12px;
    color: var(--ink-soft);
    flex: 0 0 auto;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
  }
  .stats .stat .num { color: var(--gold); font-weight: bold; }
  .stats .stat .lbl { color: var(--muted); margin-left: 4px; text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; }
  .stats .stat.match .num { color: #B0651B; }

  .body {
    flex: 1 1 auto;
    display: flex;
    min-height: 0;
  }

  /* ---------- Sidebar ---------- */
  aside.sidebar {
    width: var(--sidebar-w);
    flex: 0 0 var(--sidebar-w);
    background: var(--parchment-deep);
    border-right: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .search {
    padding: 12px 14px;
    border-bottom: 1px solid var(--rule);
    background: var(--parchment-deep);
  }
  .search input {
    width: 100%;
    border: 1px solid var(--rule);
    background: var(--parchment);
    padding: 9px 11px;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    border-radius: 0;
    outline: none;
  }
  .search input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 2px rgba(139,111,71,0.18);
  }
  .search .hint {
    margin-top: 6px;
    font-size: 11px;
    color: var(--muted);
    font-family: "SF Mono", "Menlo", monospace;
  }
  .search .hint b { color: var(--gold); font-weight: 600; }

  .filelist {
    overflow-y: auto;
    flex: 1 1 auto;
  }
  .section {
    border-bottom: 1px solid var(--rule);
  }
  .section > .head {
    color: var(--parchment);
    background: var(--hdr-root);
    padding: 7px 14px;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "SF Mono", "Menlo", monospace;
  }
  .section > .head .caret {
    font-size: 10px;
    opacity: 0.75;
    margin-right: 6px;
  }
  .section > .head .count {
    background: rgba(0,0,0,0.22);
    padding: 1px 7px;
    border-radius: 9px;
    font-size: 11px;
    font-weight: bold;
  }
  .section[data-section="root"] > .head { background: var(--hdr-root); }
  .section[data-section="appellate"] > .head { background: var(--hdr-appellate); }
  .section[data-section="authority"] > .head { background: var(--hdr-authority); }
  .section[data-section="billing"] > .head { background: var(--hdr-billing); }
  .section[data-section="client-emails"] > .head { background: var(--hdr-client-emails); }
  .section[data-section="discovery"] > .head { background: var(--hdr-discovery); }
  .section[data-section="exhibits"] > .head { background: var(--hdr-exhibits); }
  .section[data-section="lower-court"] > .head { background: var(--hdr-lower-court); }

  .section .files {
    padding: 4px 0;
    background: var(--parchment-deep);
  }
  .section.collapsed .files { display: none; }
  .section.collapsed .caret { transform: rotate(-90deg); display:inline-block; }

  .file {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 6px 14px 6px 22px;
    cursor: pointer;
    border-left: 3px solid transparent;
    color: var(--ink-soft);
  }
  .file:hover { background: rgba(139,111,71,0.07); }
  .file.active {
    background: rgba(139,111,71,0.18);
    border-left-color: var(--gold);
    color: var(--ink);
  }
  .file .name {
    flex: 1 1 auto;
    font-size: 13px;
    line-height: 1.35;
    word-break: break-word;
    font-family: "SF Mono", "Menlo", monospace;
  }
  .file .meta {
    display: flex;
    gap: 6px;
    align-items: center;
    flex: 0 0 auto;
  }
  .badge {
    font-family: "SF Mono", "Menlo", monospace;
    font-size: 9px;
    letter-spacing: 0.08em;
    padding: 1px 5px;
    border-radius: 2px;
    background: var(--rule-soft);
    color: var(--ink-soft);
    border: 1px solid var(--rule);
    text-transform: uppercase;
  }
  .badge.md { background: #E8E2D0; color: #4A3D24; border-color: #C9BC9A; }
  .badge.txt { background: #DDE3D6; color: #3A4A2A; border-color: #B9C5A4; }
  .badge.docx { background: #DCE2EC; color: #2A3A5A; border-color: #A8B5CC; }
  .file .size {
    font-family: "SF Mono", "Menlo", monospace;
    font-size: 10px;
    color: var(--muted);
    min-width: 42px;
    text-align: right;
  }
  mark.hl {
    background: var(--highlight);
    color: var(--ink);
    padding: 0 1px;
    border-radius: 1px;
  }

  /* ---------- Reader ---------- */
  main.reader {
    flex: 1 1 auto;
    overflow-y: auto;
    background: var(--parchment);
    min-width: 0;
  }
  .reader .empty {
    margin: 80px auto;
    max-width: 480px;
    text-align: center;
    color: var(--muted);
    font-style: italic;
  }
  .reader .empty h2 {
    font-style: normal;
    font-weight: normal;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 8px;
    margin-bottom: 18px;
  }
  .reader .doc {
    max-width: 820px;
    margin: 0 auto;
    padding: 36px 56px 80px;
  }
  .reader .doc .path {
    font-family: "SF Mono", "Menlo", monospace;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 8px;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
    gap: 16px;
  }
  .reader .doc .path .url {
    text-transform: none;
    letter-spacing: 0;
    color: var(--gold);
    text-decoration: none;
  }
  .reader .doc .path .url:hover { text-decoration: underline; }
  .reader .doc .docmeta {
    font-family: "SF Mono", "Menlo", monospace;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 24px;
    display: flex;
    gap: 14px;
  }
  .reader .doc h1, .reader .doc h2, .reader .doc h3 {
    font-weight: normal;
    color: var(--ink);
    letter-spacing: 0.01em;
  }
  .reader .doc h1 { font-size: 26px; margin: 18px 0 12px; }
  .reader .doc h2 { font-size: 20px; margin: 28px 0 10px; border-bottom: 1px solid var(--rule-soft); padding-bottom: 4px; }
  .reader .doc h3 { font-size: 17px; margin: 22px 0 8px; color: var(--ink-soft); }
  .reader .doc p { margin: 10px 0; }
  .reader .doc hr { border: 0; border-top: 1px solid var(--rule); margin: 22px 0; }
  .reader .doc strong { color: var(--ink); }
  .reader .doc ul, .reader .doc ol { padding-left: 26px; }
  .reader .doc li { margin: 4px 0; }
  .reader .doc blockquote {
    margin: 12px 0;
    padding: 4px 14px;
    border-left: 3px solid var(--gold);
    color: var(--ink-soft);
    background: rgba(139,111,71,0.05);
    font-style: italic;
  }
  .reader .doc pre {
    background: var(--parchment-deep);
    border: 1px solid var(--rule);
    padding: 10px 12px;
    overflow-x: auto;
    font-size: 12.5px;
  }
  .reader .doc.plain pre {
    background: var(--parchment-deep);
    border: 1px solid var(--rule);
    padding: 18px 20px;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-size: 12.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .reader .doc code:not(pre code) {
    background: var(--rule-soft);
    padding: 1px 5px;
    border-radius: 2px;
    font-size: 0.92em;
  }
  .reader .doc table {
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 13px;
  }
  .reader .doc table th, .reader .doc table td {
    border: 1px solid var(--rule);
    padding: 5px 9px;
    text-align: left;
  }
  .reader .doc table th { background: var(--parchment-deep); }

  .reader .truncated {
    margin-top: 24px;
    padding: 10px 14px;
    background: var(--parchment-deep);
    border-left: 3px solid var(--gold);
    font-size: 12px;
    color: var(--ink-soft);
    font-family: "SF Mono", "Menlo", monospace;
  }

  .footer-note {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    margin: 24px 0 40px;
    font-style: italic;
  }

  .loading {
    padding: 60px 24px;
    text-align: center;
    color: var(--muted);
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="files.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

const SECTION_ORDER = ["root", "appellate", "authority", "billing", "client-emails", "discovery", "exhibits", "lower-court"];

function sectionFor(path) {
  if (!path.includes("/")) return "root";
  return path.split("/", 1)[0];
}

function basename(path) {
  const i = path.lastIndexOf("/");
  return i < 0 ? path : path.slice(i + 1);
}

function extOf(path) {
  const i = path.lastIndexOf(".");
  if (i < 0) return "";
  return path.slice(i + 1).toLowerCase();
}

function badgeFor(path) {
  const e = extOf(path);
  if (e === "md") return { cls: "md", label: "MD" };
  if (e === "txt") return { cls: "txt", label: "TXT" };
  if (e === "docx") return { cls: "docx", label: "DOCX" };
  return { cls: "", label: e.toUpperCase() || "?" };
}

function fmtSize(n) {
  if (n == null) return "";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  return (n / (1024 * 1024)).toFixed(2) + " MB";
}

function fmtTotalSize(n) {
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
  return (n / (1024 * 1024)).toFixed(2) + " MB";
}

// --- search helpers ---------------------------------------------------------
function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

function highlight(text, query) {
  if (!query) return escapeHtml(text);
  const re = new RegExp(escapeRe(query), "gi");
  return escapeHtml(text).replace(new RegExp(escapeRe(query), "gi"), m => `<mark class="hl">${m}</mark>`);
}

function countMatches(text, query) {
  if (!query) return 0;
  const re = new RegExp(escapeRe(query), "gi");
  const m = text.match(re);
  return m ? m.length : 0;
}

// --- lightweight markdown renderer ----------------------------------------
// Headings, bold, italic, hr, ul/ol, blockquote, inline code, links.
function renderMarkdown(src, query) {
  const lines = src.split("\n");
  const out = [];
  let i = 0;

  const renderInline = (s) => {
    let h = escapeHtml(s);
    // bold **x**
    h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    // italic *x* or _x_  (avoid eating bold)
    h = h.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    h = h.replace(/(^|[^_])_([^_\n]+)_/g, "$1<em>$2</em>");
    // inline code
    h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
    // simple links [text](url)
    h = h.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    if (query) {
      const re = new RegExp(escapeRe(query), "gi");
      h = h.replace(re, m => `<mark class="hl">${m}</mark>`);
    }
    return h;
  };

  while (i < lines.length) {
    const line = lines[i];
    const trimmed = line.trim();

    if (!trimmed) { i++; continue; }

    // hr
    if (/^(---+|\*\*\*+|___+)$/.test(trimmed)) { out.push("<hr/>"); i++; continue; }

    // heading
    const hm = /^(#{1,6})\s+(.*)$/.exec(trimmed);
    if (hm) {
      const lvl = Math.min(hm[1].length, 6);
      out.push(`<h${lvl}>${renderInline(hm[2])}</h${lvl}>`);
      i++;
      continue;
    }

    // code fence
    if (/^```/.test(trimmed)) {
      i++;
      const buf = [];
      while (i < lines.length && !/^```/.test(lines[i].trim())) { buf.push(lines[i]); i++; }
      if (i < lines.length) i++;
      let body = escapeHtml(buf.join("\n"));
      if (query) {
        const re = new RegExp(escapeRe(query), "gi");
        body = body.replace(re, m => `<mark class="hl">${m}</mark>`);
      }
      out.push(`<pre><code>${body}</code></pre>`);
      continue;
    }

    // blockquote
    if (/^>\s?/.test(trimmed)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i].trim())) {
        buf.push(lines[i].replace(/^\s*>\s?/, ""));
        i++;
      }
      out.push(`<blockquote>${renderInline(buf.join(" "))}</blockquote>`);
      continue;
    }

    // unordered list
    if (/^[-*+]\s+/.test(trimmed)) {
      const items = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*+]\s+/, ""));
        i++;
      }
      out.push("<ul>" + items.map(it => `<li>${renderInline(it)}</li>`).join("") + "</ul>");
      continue;
    }

    // ordered list
    if (/^\d+\.\s+/.test(trimmed)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, ""));
        i++;
      }
      out.push("<ol>" + items.map(it => `<li>${renderInline(it)}</li>`).join("") + "</ol>");
      continue;
    }

    // table (very small subset: pipe-delimited with header sep)
    if (/^\|.+\|$/.test(trimmed) && i + 1 < lines.length && /^\|[\s\-:|]+\|$/.test(lines[i+1].trim())) {
      const splitRow = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = splitRow(lines[i]);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\|.+\|$/.test(lines[i].trim())) {
        rows.push(splitRow(lines[i]));
        i++;
      }
      const thead = "<tr>" + head.map(c => `<th>${renderInline(c)}</th>`).join("") + "</tr>";
      const tbody = rows.map(r => "<tr>" + r.map(c => `<td>${renderInline(c)}</td>`).join("") + "</tr>").join("");
      out.push(`<table>${thead}${tbody}</table>`);
      continue;
    }

    // paragraph
    const para = [line];
    i++;
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|>|---+$|\*\*\*+$|___+$|```|[-*+]\s|\d+\.\s|\|)/.test(lines[i].trim())) {
      para.push(lines[i]);
      i++;
    }
    out.push("<p>" + renderInline(para.join(" ")) + "</p>");
  }
  return out.join("\n");
}

// --- main app -------------------------------------------------------------
function App() {
  const data = window.LAI_MATTER;
  const [query, setQuery] = useState("");
  const [activePath, setActivePath] = useState(null);
  const [collapsed, setCollapsed] = useState(() => new Set());

  if (!data) {
    return <div className="loading">
      <h3>files.js not loaded</h3>
      <p>Run <code className="mono">python3 build_files_js.py</code> in this directory to generate the matter bundle, then reopen this page.</p>
    </div>;
  }

  const files = data.index;
  const bodies = data.files;

  // group + filter
  const grouped = useMemo(() => {
    const q = query.trim();
    const groups = {};
    for (const sec of SECTION_ORDER) groups[sec] = [];
    for (const f of files) {
      const sec = sectionFor(f.path);
      if (!groups[sec]) groups[sec] = [];
      const body = bodies[f.path] || "";
      let nameMatches = 0, bodyMatches = 0;
      if (q) {
        nameMatches = countMatches(f.path, q);
        bodyMatches = countMatches(body, q);
        if (!nameMatches && !bodyMatches) continue;
      }
      groups[sec].push({ ...f, nameMatches, bodyMatches });
    }
    return groups;
  }, [files, bodies, query]);

  const totals = useMemo(() => {
    let totalSize = 0;
    for (const f of files) totalSize += f.size || 0;
    let matchCount = 0;
    if (query.trim()) {
      const q = query.trim();
      for (const f of files) {
        matchCount += countMatches(f.path, q);
        matchCount += countMatches(bodies[f.path] || "", q);
      }
    }
    return {
      total: files.length,
      sections: SECTION_ORDER.filter(s => (grouped[s] && grouped[s].length > 0) || !query.trim()).length,
      sectionsAll: SECTION_ORDER.length,
      totalSize,
      matchCount,
      filtered: SECTION_ORDER.reduce((n, s) => n + (grouped[s]?.length || 0), 0),
    };
  }, [files, bodies, grouped, query]);

  const toggleSection = (sec) => {
    setCollapsed(prev => {
      const next = new Set(prev);
      if (next.has(sec)) next.delete(sec); else next.add(sec);
      return next;
    });
  };

  const activeFile = files.find(f => f.path === activePath);
  const activeBody = activeFile ? (bodies[activeFile.path] || "") : "";

  return (
    <div className="app">
      <header className="banner">
        <h1>Smith Software, LLC<span className="v">v.</span>Grünfeld Präzisionstechnik GmbH</h1>
        <div className="sub">Matter file browser · LAI 2026 mini-matter · {data.matter || "mini-matter-uk"}</div>
      </header>

      <div className="stats">
        <div className="stat"><span className="num">{totals.total}</span><span className="lbl">Documents</span></div>
        <div className="stat"><span className="num">{totals.sectionsAll}</span><span className="lbl">Sections</span></div>
        <div className="stat"><span className="num">{fmtTotalSize(totals.totalSize)}</span><span className="lbl">Total size</span></div>
        {query.trim() && (
          <>
            <div className="stat match"><span className="num">{totals.filtered}</span><span className="lbl">Files matched</span></div>
            <div className="stat match"><span className="num">{totals.matchCount}</span><span className="lbl">Matches</span></div>
          </>
        )}
      </div>

      <div className="body">
        <aside className="sidebar">
          <div className="search">
            <input
              type="search"
              placeholder="Search filenames and contents…"
              value={query}
              onChange={e => setQuery(e.target.value)}
              autoFocus
            />
            <div className="hint">{query.trim() ? <>matching <b>{totals.filtered}</b> file{totals.filtered === 1 ? "" : "s"}</> : <>{files.length} files · click to read</>}</div>
          </div>
          <div className="filelist">
            {SECTION_ORDER.map(sec => {
              const items = grouped[sec] || [];
              if (query.trim() && items.length === 0) return null;
              const isCollapsed = collapsed.has(sec);
              return (
                <div key={sec} className={`section ${isCollapsed ? "collapsed" : ""}`} data-section={sec}>
                  <div className="head" onClick={() => toggleSection(sec)}>
                    <span><span className="caret">▾</span> {sec}</span>
                    <span className="count">{items.length}</span>
                  </div>
                  <div className="files">
                    {items.map(f => {
                      const b = badgeFor(f.path);
                      const name = basename(f.path);
                      const isActive = f.path === activePath;
                      return (
                        <div
                          key={f.path}
                          className={`file ${isActive ? "active" : ""}`}
                          onClick={() => setActivePath(f.path)}
                          title={f.path}
                        >
                          <span className={`badge ${b.cls}`}>{b.label}</span>
                          <span className="name"
                                dangerouslySetInnerHTML={{ __html: highlight(name, query.trim()) }} />
                          <span className="size">{fmtSize(f.size)}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </aside>

        <main className="reader">
          {!activeFile && (
            <div className="empty">
              <h2>No document selected</h2>
              <p>Choose a file from the left to read its contents.<br/>
              Use the search box to filter by filename or full-text content; matches are highlighted in gold.</p>
              <p style={{ marginTop: 24, fontSize: 12 }}>
                The corpus contains intentionally planted inconsistencies and citation errors. They are surfaced as-found, not corrected.
              </p>
            </div>
          )}
          {activeFile && (
            <Reader file={activeFile} body={activeBody} query={query.trim()} />
          )}
        </main>
      </div>
    </div>
  );
}

function Reader({ file, body, query }) {
  const ext = extOf(file.path);
  const isMd = ext === "md";
  const isText = ext === "md" || ext === "txt";
  const ref = useRef(null);

  // For very large authority files, render a slice and offer to expand.
  const LIMIT = 200_000;
  const [showAll, setShowAll] = useState(false);
  useEffect(() => { setShowAll(false); /* reset on file change */ }, [file.path]);

  const truncated = isText && body.length > LIMIT && !showAll;
  const shown = truncated ? body.slice(0, LIMIT) : body;

  const html = useMemo(() => {
    if (!isText) return null;
    if (isMd) return renderMarkdown(shown, query);
    // plain text
    let h = escapeHtml(shown);
    if (query) {
      const re = new RegExp(escapeRe(query), "gi");
      h = h.replace(re, m => `<mark class="hl">${m}</mark>`);
    }
    return `<pre>${h}</pre>`;
  }, [shown, query, isMd, isText]);

  // Scroll first match into view
  useEffect(() => {
    if (!ref.current || !query) return;
    const m = ref.current.querySelector("mark.hl");
    if (m) m.scrollIntoView({ block: "center", behavior: "smooth" });
  }, [file.path, query, shown]);

  return (
    <div className={`doc ${isMd ? "md" : "plain"}`} ref={ref}>
      <div className="path">
        <span>{file.path}</span>
        <a className="url" href={file.url} target="_blank" rel="noopener">view source ↗</a>
      </div>
      <div className="docmeta">
        <span>{badgeFor(file.path).label}</span>
        <span>·</span>
        <span>{fmtSize(file.size)}</span>
        <span>·</span>
        <span>{(file.mime_type || "").replace("application/vnd.openxmlformats-officedocument.wordprocessingml.document", "docx")}</span>
        {query && (() => {
          const total = countMatches(body, query);
          return <><span>·</span><span style={{color: "#B0651B"}}>{total} match{total===1?"":"es"} for "{query}"</span></>;
        })()}
      </div>
      {isText ? (
        <div dangerouslySetInnerHTML={{ __html: html }} />
      ) : (
        <p><em>{body || "Binary file — not bundled. Open the source link to download."}</em></p>
      )}
      {truncated && (
        <div className="truncated">
          Showing first {LIMIT.toLocaleString()} of {body.length.toLocaleString()} characters.
          {" "}<a href="#" onClick={e => { e.preventDefault(); setShowAll(true); }}>Load the rest →</a>
        </div>
      )}
      <div className="footer-note">end of document · {file.path}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
